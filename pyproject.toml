[project]
name = "agent-platform"
version = "0.1.0"
description = "Enterprise agent platform: LLM gateway, async RAG, LangGraph strategies, eval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agent-shared",
  "llm-gateway",
  "agent-rag",
  "agent-core",
  "agent-eval",
  "agent-api",
  "agent-rag-worker",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",
  "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.uv.workspace]
members = [
  "backend/packages/shared",
  "backend/packages/llm-gateway",
  "backend/packages/rag",
  "backend/packages/agent-core",
  "backend/packages/eval",
  "backend/apps/api",
  "backend/apps/rag-worker",
]

[tool.uv.sources]
agent-shared = { workspace = true }
llm-gateway = { workspace = true }
agent-rag = { workspace = true }
agent-core = { workspace = true }
agent-eval = { workspace = true }
agent-api = { workspace = true }
agent-rag-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
