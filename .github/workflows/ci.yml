name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e backend/packages/shared -e backend/packages/llm-gateway \
            -e backend/packages/rag -e backend/packages/agent-core \
            -e backend/packages/eval -e backend/apps/api -e backend/apps/rag-worker
          pip install -e ".[dev]"

      - name: Smoke import
        run: python scripts/smoke_import.py

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Mock eval harness
        run: >
          python scripts/run_eval.py --mode mock --kind all
          --fail-under hit_at_k=1.0,success_rate=1.0,tool_accuracy=1.0,skill_accuracy=1.0,faithfulness=1.0,relevancy=1.0
