[project]
name = "agent-rag-worker"
version = "0.1.0"
description = "RabbitMQ consumers for RAG ingest stages"
requires-python = ">=3.9"
dependencies = [
  "agent-shared",
  "agent-rag",
  "llm-gateway",
  "aio-pika>=9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]
