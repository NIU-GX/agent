replicaCount:
  api: 2
  worker: 2
  parser: 1
  web: 1
  litellm: 1

image:
  api: agent-platform/api:0.1.0
  worker: agent-platform/worker:0.1.0
  web: agent-platform/web:0.1.0
  litellm: ghcr.io/berriai/litellm:main-stable
  opensearch: opensearchproject/opensearch:2.14.0
  reranker: ghcr.io/flagopen/flagembedding:latest
  pullPolicy: IfNotPresent

service:
  apiPort: 8000
  webPort: 80
  litellmPort: 4000

ingress:
  enabled: true
  host: agent.local
  className: nginx

env:
  APP_ENV: prod
  ALLOW_INMEMORY_FALLBACK: "false"
  RABBITMQ_URL: amqp://user:pass@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  MILVUS_HOST: milvus
  MINIO_ENDPOINT: minio:9000
  POSTGRES_HOST: postgres
  # 留空则模板默认 http://<release>-litellm:4000
  LLM_BASE_URL: ""
  LLM_CHAT_MODEL: gpt-4o-mini
  LLM_EMBED_MODEL: text-embedding-3-small
  LLM_FALLBACK_CHAT_MODEL: gpt-4o-mini
  AGENT_ENABLE_CHECKPOINT: "true"
  RAG_RERANK_MODE: llm
  OPENSEARCH_URL: ""
  OPENSEARCH_INDEX: kb_chunks_v2
  RERANKER_URL: ""
  AUTO_CREATE_SCHEMA: "false"
  RAG_MAX_UPLOAD_BYTES: "26214400"
  RAG_PARSER_TIMEOUT_SECONDS: "90"

secrets:
  APP_API_KEY: change-me
  LITELLM_MASTER_KEY: sk-litellm-master
  OPENAI_API_KEY: sk-xxx
  ANTHROPIC_API_KEY: ""
  POSTGRES_PASSWORD: agent
  API_KEY_PEPPER: change-me

resources:
  api:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  worker:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  parser:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  litellm:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
