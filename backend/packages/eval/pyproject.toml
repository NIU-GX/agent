[project]
name = "agent-eval"
version = "0.1.0"
description = "Retrieval / DeepEval generation / trajectory eval harness"
requires-python = ">=3.12"
dependencies = [
  "agent-shared",
  "deepeval>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval"]
