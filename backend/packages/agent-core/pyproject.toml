[project]
name = "agent-core"
version = "0.1.0"
description = "LangGraph agent strategies: CoT, ReAct, Plan-and-Execute"
requires-python = ">=3.12"
dependencies = [
  "agent-shared",
  "agent-rag",
  "llm-gateway",
  "langgraph>=1.0",
  "langchain-core>=0.3",
  "langgraph-checkpoint-postgres>=2.0.21",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.28",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]
