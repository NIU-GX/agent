[project]
name = "agent-rag"
version = "0.1.0"
description = "Async RAG ingest (RabbitMQ) + hybrid retrieve for agent platform"
requires-python = ">=3.12"
dependencies = [
  "agent-shared",
  "llm-gateway",
  "aio-pika>=9.5",
  "pymilvus>=2.4,<3",
  "minio>=7.2",
  "pypdf>=5.0",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]
