[project]
name = "llm-gateway"
version = "0.1.0"
description = "Enterprise LLM gateway: routing, rate limit, circuit breaker, fallback, usage"
requires-python = ">=3.9"
dependencies = [
  "agent-shared",
  "httpx>=0.27",
  "litellm>=1.40",
  "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_gateway"]
