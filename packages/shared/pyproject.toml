[project]
name = "agent-shared"
version = "0.1.0"
description = "Shared config, schemas, logging, Postgres metadata for agent platform"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "eval-type-backport>=0.2",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
