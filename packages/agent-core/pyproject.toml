[project]
name = "agent-core"
version = "0.1.0"
description = "LangGraph agent strategies: CoT, ReAct, Plan-and-Execute"
requires-python = ">=3.9"
dependencies = [
  "agent-shared",
  "agent-rag",
  "llm-gateway",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0; python_version >= '3.10'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]
